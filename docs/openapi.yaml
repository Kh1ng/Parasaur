openapi: 3.1.0
info:
  title: Parasaur Control Plane API
  version: "0.1.0"
  description: |
    HTTP surface for apps/server, the Node control-plane that wraps the `gah`
    CLI/Rust binary. Hand-written from apps/server/src/server.ts (the single
    source of truth) rather than generated -- keep it in sync manually until
    #NNN (generate-from-route-table tooling) exists, if that's ever worth it.

    This is deliberately a snapshot of what apps/server exposes TODAY, not a
    design document for what it should expose. Issue #861 closed the
    dispatch/sync/ledger-summary/availability/hold gap that used to be
    documented here.

    Issue #532 is partially implemented. Loop start/stop, hold set/clear,
    availability clear, and ledger clear-attempts require Idempotency-Key.
    These six HTTP operations keep durable receipts and append-only audit
    records. Repeated keys return 409 without executing again, including
    after a restart. Other mutation routes do not yet share this protection.

    Response schemas are typed at the field-name/type level for the
    endpoints most likely to be consumed programmatically (status, profiles,
    config); several less-critical endpoints use a looser `object` schema
    rather than exhaustively transcribing every nested field from
    packages/contracts/src/gah.ts -- follow that file for full fidelity.
  license:
    name: Same as repository
servers:
  - url: http://localhost:3773
    description: Default local apps/server port
tags:
  - name: health
  - name: status
  - name: profiles
  - name: config
  - name: manager-chat
  - name: loop
  - name: events
  - name: registry
    description: Multi-node fleet registration (auth-gated via authMiddleware)

# Trusted direct-local requests may omit the token; remote API requests may not.
security: [{ nodeAuth: [] }]

paths:
  /api/planning/epics:
    get:
      operationId: planning.epics
      summary: List the issues a central-node profile can map (parents, or labelled epic or wayfinder:map) and its chartr .plan/maps/ map files
      description: Types in packages/contracts/src/planning.ts. Read-only; runs `gah map --json`. Cached for 60 seconds.
      parameters:
        - { name: profile, in: query, required: true, schema: { type: string } }
        - { name: refresh, in: query, schema: { type: string, enum: ["1"] } }
      responses:
        "200": { description: "PlanningEpicList. When issues cannot be read but map files exist, `issues_error` says why and the files are still listed." }
        "502": { description: The provider or the map files could not be read }
  /api/planning/map:
    get:
      operationId: planning.map
      summary: Read one epic, or one .plan/maps/ map file, as nodes, child and blocker edges, and the frontier
      parameters:
        - { name: profile, in: query, required: true, schema: { type: string } }
        - { name: epic, in: query, schema: { type: integer, minimum: 1 }, description: "Exactly one of epic and file." }
        - { name: file, in: query, schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,99}$" }, description: "A .plan/maps/ slug, read from the checkout without provider requests." }
        - { name: refresh, in: query, schema: { type: string, enum: ["1"] } }
      responses:
        "200": { description: PlanningMap }
        "502": { description: The provider or the map files could not be read }
  /api/planning/settings:
    get:
      operationId: planning.settings.get
      summary: Where grill-me records answers for a profile (issues, or a repository Markdown file)
      parameters:
        - { name: profile, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: PlanningSettings }
    put:
      operationId: planning.settings.set
      summary: Choose where grill-me records answers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile, answers, path]
              properties:
                profile: { type: string }
                answers: { type: string, enum: [issues, file] }
                path: { type: string, description: Repository-relative path ending in .md }
      responses:
        "200": { description: PlanningSettings }
        "400": { description: Invalid answers mode or path }
  /api/planning/chats:
    post:
      operationId: planning.chats.start
      summary: Start a grill-me chat or a ticket discussion seeded with the map
      requestBody:
        required: true
        content:
          application/json:
            schema: { description: PlanningChatRequest }
      responses:
        "201": { description: ChatSessionSummary }
        "400": { description: Invalid request }
        "422": { description: The chat session could not be created }
  /api/pm/plans:
    get:
      operationId: pm.plans.list
      summary: List saved PM plan summaries for a configured profile
      description: Version 1 contract in packages/contracts/src/pm-plan.ts. See docs/PM_PLAN_API.md for authentication, pagination, and errors.
      parameters:
        - { name: profile, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200": { description: PmPlanList, including per-plan errors and next_cursor }
        "422": { description: Profile or artifact directory unavailable }
  /api/pm/plans/{planId}:
    get:
      operationId: pm.plans.show
      summary: Read a saved plan, dependency graph, publication state, and failures
      parameters:
        - { name: profile, in: query, required: true, schema: { type: string } }
        - { name: planId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: PmPlanDetail }
        "422": { description: Invalid profile, foreign artifact, or unreadable plan }
  /api/pm/plans/{planId}/dry-run:
    post:
      operationId: pm.plans.dry-run
      summary: Validate publication with the configured provider without writes
      parameters:
        - { name: planId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [profile]
              properties:
                profile: { type: string }
      responses:
        "200": { description: PmPlanOperation with proposed actions }
        "409": { description: PmPlanOperation with validation failure and saved state }
  /api/pm/plans/{planId}/publish:
    post:
      operationId: pm.plans.publish
      summary: Approve the reviewed fingerprint and publish under existing backend policy
      parameters:
        - { name: planId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [profile, approve, plan_fingerprint]
              properties:
                profile: { type: string }
                approve: { type: boolean, const: true }
                plan_fingerprint: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        "200": { description: PmPlanOperation after publication }
        "400": { description: Explicit approval and reviewed fingerprint required }
        "409": { description: PmPlanOperation with publication failure and partial state }
        "422": { description: Plan unavailable or fingerprint no longer matches }
  /health:
    get:
      security: []
      tags: [health]
      summary: Liveness/readiness check
      responses:
        "200":
          description: Server status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [healthy, starting] }
                  node_id: { type: string }
                  display_name: { type: string }
                  advertised_url: { type: string }
                  version: { type: string }
                  schema_digest: { type: string }
                  timestamp: { type: integer }
                  checks: { type: object }

  /api/info:
    get:
      tags: [health]
      summary: Server identity, feature flags, and a self-describing endpoint map
      responses:
        "200":
          description: Server info
          content:
            application/json:
              schema:
                type: object

  /api/status:
    get:
      tags: [status]
      summary: Aggregated profile status (fans out to registered fleet nodes)
      description: |
        Requires authMiddleware (loopback callers are exempt). Wraps
        `gah status --profile <p> --json`, enriched with this node's identity,
        local resource pressure, and observations from other registered nodes.
      parameters:
        - name: profile
          in: query
          schema: { type: string, default: gah }
      responses:
        "200":
          description: Status snapshot (StatusSnapshot + node fan-out, see packages/contracts/src/gah.ts)
          content:
            application/json:
              schema: { type: object }
        "502":
          description: gah status failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/quota:
    get:
      tags: [status]
      summary: Backend/model quota snapshot
      parameters:
        - name: profile
          in: query
          schema: { type: string, default: gah }
        - name: since
          in: query
          schema: { type: string, default: 7d }
      responses:
        "200":
          description: QuotaSnapshot
          content:
            application/json:
              schema: { type: object }
        "502": { $ref: "#/components/responses/GahError" }

  /api/doctor:
    get:
      tags: [status]
      summary: Profile health/readiness diagnostics
      parameters:
        - name: profile
          in: query
          schema: { type: string, default: gah }
      responses:
        "200":
          description: DoctorSnapshot
          content:
            application/json:
              schema: { type: object }
        "502": { $ref: "#/components/responses/GahError" }

  /api/report:
    get:
      tags: [status]
      summary: Usage/cost report with CLI grouping
      parameters:
        - name: profile
          in: query
          schema: { type: string }
        - name: since
          in: query
          description: Relative duration such as 7d or 24h
          schema: { type: string, default: 7d }
        - name: groupBy
          in: query
          schema: { type: string, enum: [none, backend, model, difficulty, backend-difficulty], default: backend }
      responses:
        "400":
          description: groupBy is unsupported or is not a single value
        "200":
          description: ReportData
          content:
            application/json:
              schema: { type: object }
        "502": { $ref: "#/components/responses/GahError" }

  /api/report/series:
    get:
      tags: [status]
      summary: Time-bucketed usage/cost series
      parameters:
        - name: profile
          in: query
          schema: { type: string }
        - name: since
          in: query
          description: Relative duration such as 7d or 24h
          schema: { type: string, default: 7d }
        - name: bucket
          in: query
          schema: { type: string }
      responses:
        "200":
          description: ReportSeriesData
          content:
            application/json:
              schema: { type: object }
        "502": { $ref: "#/components/responses/GahError" }

  /api/work/{workId}:
    get:
      tags: [status]
      summary: Full ledger history for one work item (all attempts)
      parameters:
        - name: workId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: LedgerEntry[]
          content:
            application/json:
              schema: { type: array, items: { type: object } }
        "502": { $ref: "#/components/responses/GahError" }

  /api/sync:
    get:
      tags: [status]
      summary: Classified open (and recently resolved) merge requests/pull requests for a profile
      parameters:
        - name: profile
          in: query
          schema: { type: string }
      responses:
        "200":
          description: MergeRequest[]
          content:
            application/json:
              schema: { type: array, items: { type: object } }
        "502": { $ref: "#/components/responses/GahError" }

  /api/ledger/summary:
    get:
      tags: [status]
      summary: Aggregate ledger counts (success/fail, by mode/backend/model, token usage) over a time window
      parameters:
        - name: profile
          in: query
          schema: { type: string }
        - name: since
          in: query
          schema: { type: string, default: 7d }
        - name: groupBy
          in: query
          schema: { type: string, enum: [none, backend, model, difficulty, backend-difficulty], default: none }
      responses:
        "400":
          description: groupBy is unsupported or is not a single value
        "200":
          description: LedgerSummary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerSummary" }
        "502": { $ref: "#/components/responses/GahError" }

  /api/ledger/clear-attempts:
    post:
      tags: [status]
      summary: Append a tombstone ledger entry so a work_id becomes dispatchable again
      description: Requires owner access; paired devices cannot clear attempt history.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workId]
              properties:
                profile: { type: string }
                workId: { type: string }
                dryRun: { type: boolean }
      responses:
        "200": { description: "{ ok: true }" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Owner access required }
        "409": { $ref: "#/components/responses/MutationConflict" }
        "503": { $ref: "#/components/responses/MutationStorageUnavailable" }
        "502": { $ref: "#/components/responses/GahError" }

  /api/availability:
    get:
      tags: [status]
      summary: Durable backend/model availability state (global, not per-profile)
      responses:
        "200":
          description: AvailabilityRecord[]
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AvailabilityRecord" } }
        "502": { $ref: "#/components/responses/GahError" }

  /api/availability/clear:
    post:
      tags: [status]
      summary: Override a stale unavailable record once the backend is confirmed healthy again
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [backend]
              properties:
                backend: { type: string }
                backendInstance: { type: string }
                model: { type: string }
                quotaPool: { type: string }
      responses:
        "200": { description: "{ ok: true }" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/MutationConflict" }
        "503": { $ref: "#/components/responses/MutationStorageUnavailable" }
        "502": { $ref: "#/components/responses/GahError" }

  /api/hold:
    get:
      tags: [status]
      summary: Work IDs currently under an out-of-band manager review hold for a profile
      description: >-
        No standalone `gah hold list` exists -- this reads
        StatusSnapshot.review_held_work_ids from `gah status --json` rather
        than a dedicated CLI subcommand.
      parameters:
        - name: profile
          in: query
          schema: { type: string }
      responses:
        "200":
          description: "{ profile: string, workIds: string[] }"
          content:
            application/json:
              schema: { type: object }
        "502": { $ref: "#/components/responses/GahError" }

  /api/hold/set:
    post:
      tags: [status]
      summary: Mark a work_id as under active out-of-band manager review
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workId]
              properties:
                profile: { type: string }
                workId: { type: string }
                reason: { type: string }
      responses:
        "200": { description: "{ ok: true }" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/MutationConflict" }
        "503": { $ref: "#/components/responses/MutationStorageUnavailable" }
        "502": { $ref: "#/components/responses/GahError" }

  /api/hold/clear:
    post:
      tags: [status]
      summary: Release a previously set review hold on a work_id
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workId]
              properties:
                profile: { type: string }
                workId: { type: string }
      responses:
        "200": { description: "{ ok: true }" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/MutationConflict" }
        "503": { $ref: "#/components/responses/MutationStorageUnavailable" }
        "502": { $ref: "#/components/responses/GahError" }

  /api/dispatch:
    post:
      tags: [status]
      summary: Submit a dispatch as a fleet Session
      description: >-
        Returns as soon as the Session is created (202) by default. When
        waitForCompletion is true, waits for the Session's terminal push event
        and returns 200, or 202 if waitTimeoutSeconds elapses. Reuses the same
        fleetDispatch coordinator and push bus as WebSocket dispatch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile, providerKind, instanceId, repo, mode]
              properties:
                profile: { type: string }
                providerKind: { type: string, enum: [github, gitlab] }
                instanceId: { type: string }
                repo: { type: string }
                mode: { type: string }
                branch: { type: string }
                target: { type: string }
                mr: { type: string, description: Existing pull or merge request number to repair }
                backend: { type: string }
                model: { type: string }
                budget: { type: number }
                dryRun: { type: boolean }
                retries: { type: integer }
                allowDraftFail: { type: boolean }
                prod: { type: boolean }
                allowUnknownRedBaseline: { type: boolean }
                escalate: { type: boolean }
                waitForCompletion: { type: boolean, default: false }
                waitTimeoutSeconds: { type: integer, minimum: 1, maximum: 7200, default: 3600 }
      responses:
        "200":
          description: "{ session: Session, timedOut: false }"
          content:
            application/json:
              schema: { type: object }
        "202":
          description: "{ session: Session } or { session: Session, timedOut: true }"
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/BadRequest" }
        "502": { $ref: "#/components/responses/GahError" }

  /api/profiles:
    get:
      tags: [profiles]
      summary: List configured GAH profiles
      responses:
        "200":
          description: ProfileSummary[]
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ProfileSummary" } }
        "502": { $ref: "#/components/responses/GahError" }
    post:
      tags: [profiles]
      summary: Add a new profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, display_name, repo_id, provider, repo, local_path, artifact_root]
              properties:
                name: { type: string }
                display_name: { type: string }
                repo_id: { type: string }
                provider: { type: string, enum: [github, gitlab] }
                repo: { type: string }
                local_path: { type: string }
                artifact_root: { type: string }
      responses:
        "201": { description: Created }
        "502": { $ref: "#/components/responses/GahError" }

  /api/profiles/{name}:
    patch:
      tags: [profiles]
      summary: Update fields on an existing profile
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: Updated }
        "502": { $ref: "#/components/responses/GahError" }
    delete:
      tags: [profiles]
      summary: Remove a profile
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: force
          in: query
          schema: { type: string, enum: ["true", "false"] }
      responses:
        "200": { description: Removed }
        "502": { $ref: "#/components/responses/GahError" }

  /api/config:
    get:
      tags: [config]
      summary: Global config defaults (current_manager, etc.)
      responses:
        "200":
          description: ConfigSummary
          content:
            application/json:
              schema: { type: object }
        "502": { $ref: "#/components/responses/GahError" }
    post:
      tags: [config]
      summary: Update global config defaults
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                current_manager: { type: string, nullable: true }
                clear: { type: array, items: { type: string } }
      responses:
        "200": { description: Updated }
        "502": { $ref: "#/components/responses/GahError" }

  /api/config/effective:
    get:
      tags: [config]
      summary: Fully-resolved effective config for one profile (routing, publishing, context)
      parameters:
        - name: profile
          in: query
          schema: { type: string, default: gah }
      responses:
        "200":
          description: ConfigProfileSummary
          content:
            application/json:
              schema: { type: object }
        "502": { $ref: "#/components/responses/GahError" }

  /api/manager-chat/settings:
    get:
      tags: [manager-chat]
      summary: Manager-chat backend selection (default + per-profile overrides)
      responses:
        "200":
          description: ManagerChatSettings + availableBackends
          content:
            application/json:
              schema: { type: object }
    post:
      tags: [manager-chat]
      summary: Update manager-chat backend selection
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                defaultBackend: { type: string }
                profileOverrides: { type: object, additionalProperties: { type: string } }
      responses:
        "200": { description: Updated }
        "400": { $ref: "#/components/responses/GahError" }

  /api/manager-chat/bridge/telegram:
    post:
      tags: [manager-chat]
      summary: Accept one authenticated Telegram webhook update
      security: [{ telegramWebhook: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "202": { description: New update accepted }
        "200": { description: Duplicate update already processing or replayed safely }
        "401": { description: Missing or invalid Telegram webhook secret }
        "502": { description: Manager or Telegram delivery failed; retry the same update ID }

  /api/manager-chat/bridge/operators:
    get:
      tags: [manager-chat]
      summary: List paired and revoked messaging identities
      responses:
        "200": { description: Bridge operator records }
        "403": { description: Owner access required }
    post:
      tags: [manager-chat]
      summary: Pair an exact Telegram user, chat, role, and profile scope
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [externalUserId, chatId, role, profiles]
              properties:
                externalUserId: { type: string }
                chatId: { type: string }
                role: { type: string, enum: [owner, chat] }
                profiles: { type: array, minItems: 1, maxItems: 32, items: { type: string } }
      responses:
        "201": { description: Identity paired }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Owner access required }
        "409": { $ref: "#/components/responses/MutationConflict" }

  /api/manager-chat/bridge/operators/revoke:
    post:
      tags: [manager-chat]
      summary: Revoke one paired messaging identity
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operatorId]
              properties:
                operatorId: { type: string }
      responses:
        "200": { description: Identity revoked }
        "403": { description: Owner access required }
        "404": { description: Active identity not found }
        "409": { $ref: "#/components/responses/MutationConflict" }

  /api/manager-chat/commands:
    get:
      tags: [manager-chat]
      summary: Live slash-command list from the active backend's own registry
      parameters:
        - name: profile
          in: query
          schema: { type: string, default: gah }
      responses:
        "200":
          description: "{ commands: ManagerCommandInfo[] }"
          content:
            application/json:
              schema: { type: object }
        "502": { $ref: "#/components/responses/GahError" }

  /api/manager-chat/models:
    get:
      tags: [manager-chat]
      summary: Live selectable-model list from the active backend's ACP session
      parameters:
        - name: profile
          in: query
          schema: { type: string, default: gah }
      responses:
        "200":
          description: "{ models: ManagerModelInfo[]; currentModelId: string | null }"
          content:
            application/json:
              schema: { type: object }
        "502": { $ref: "#/components/responses/GahError" }

  /api/manager-chat/model:
    post:
      tags: [manager-chat]
      summary: Switch the active model for a profile's manager-chat session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modelId]
              properties:
                profile: { type: string }
                modelId: { type: string }
      responses:
        "200": { description: Switched }
        "400": { description: Missing modelId }
        "502": { $ref: "#/components/responses/GahError" }

  /api/loop/status:
    get:
      tags: [loop]
      summary: Status of the `gah loop --profile <p>` systemd user unit
      parameters:
        - name: profile
          in: query
          schema: { type: string, default: gah }
      responses:
        "200":
          description: LoopStatus
          content:
            application/json:
              schema: { type: object }

  /api/loop/start:
    post:
      tags: [loop]
      summary: Start the loop unit for a profile
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { profile: { type: string } }
      responses:
        "200": { description: Started }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: >-
            Already running, a lifecycle conflict, or a previously accepted key.
            A repeated key never executes again. A key reused with different input
            returns idempotency_conflict. Refresh status before another action;
            do not automatically retry with a new key.
        "503": { $ref: "#/components/responses/MutationStorageUnavailable" }
        "502": { $ref: "#/components/responses/GahError" }

  /api/loop/stop:
    post:
      tags: [loop]
      summary: Stop the loop unit for a profile
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { profile: { type: string } }
      responses:
        "200": { description: Stopped }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: >-
            A lifecycle conflict or a previously accepted key. A repeated key
            never executes again. A key reused with different input returns
            idempotency_conflict. Refresh status before another action;
            do not automatically retry with a new key.
        "503": { $ref: "#/components/responses/MutationStorageUnavailable" }

  /api/events:
    get:
      tags: [events]
      summary: Raw controller event stream for a profile
      parameters:
        - name: profile
          in: query
          schema: { type: string, default: gah }
        - name: since
          in: query
          schema: { type: string, default: 7d }
      responses:
        "200":
          description: ControllerEvent[]
          content:
            application/json:
              schema: { type: array, items: { type: object } }
        "502": { $ref: "#/components/responses/GahError" }

  /api/controller-activity:
    get:
      tags: [events]
      summary: Controller events, derived into a UI-friendly activity feed
      parameters:
        - name: profile
          in: query
          schema: { type: string, default: gah }
        - name: since
          in: query
          schema: { type: string, default: 24h }
      responses:
        "200":
          description: Derived controller activity
          content:
            application/json:
              schema: { type: array, items: { type: object } }
        "502": { $ref: "#/components/responses/GahError" }

  /api/registry/nodes:
    get:
      tags: [registry]
      summary: List registered fleet nodes
      security: [{ nodeAuth: [] }]
      responses:
        "200": { description: Nodes summary, content: { application/json: { schema: { type: object } } } }
    post:
      tags: [registry]
      summary: Register a new fleet node
      security: [{ nodeAuth: [] }]
      requestBody:
        content: { application/json: { schema: { type: object } } }
      responses:
        "201": { description: Registered }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/registry/nodes/{nodeId}:
    delete:
      tags: [registry]
      summary: Revoke a registered node
      security: [{ nodeAuth: [] }]
      parameters:
        - name: nodeId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Revoked }
        "404": { description: Not found }

  /api/registry/nodes/{nodeId}/health:
    get:
      tags: [registry]
      summary: Check one node's health
      security: [{ nodeAuth: [] }]
      parameters:
        - name: nodeId
          in: path
          required: true
          schema: { type: string }
        - name: profile
          in: query
          schema: { type: string }
      responses:
        "200": { description: Health result }
        "404": { description: Not found }

  /api/registry/nodes/{nodeId}/rotate-secret:
    post:
      tags: [registry]
      summary: Rotate a node's shared secret
      security: [{ nodeAuth: [] }]
      parameters:
        - name: nodeId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { secret_ref: { type: string } }
      responses:
        "200": { description: Rotated }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/registry/fleet:
    get:
      tags: [registry]
      summary: Aggregated observations across the whole registered fleet
      security: [{ nodeAuth: [] }]
      parameters:
        - name: profile
          in: query
          schema: { type: string }
      responses:
        "200": { description: Fleet observations }
        "500": { description: Internal error }

  /api/cli-router:
    get:
      tags: [status]
      summary: Read the central node's subscription router snapshot
      description: >-
        Read-only MCP tool gah_cli_router uses this route. Returns safe account
        metadata, quota observations, model IDs, and connection key presence.
        Key values and provider tokens are never returned. Quota requires an
        explicit per-account refresh. See packages/contracts/src/cli-router.ts.
      responses:
        "200":
          description: CliRouterSnapshot (unconfigured, connected, or unavailable)
          content:
            application/json:
              schema: { type: object }
        "500": { description: Private router configuration is unreadable or corrupted }
        "429": { description: Router request rate limit reached }
  /api/cli-router/settings:
    put:
      tags: [config]
      summary: Configure and test an owner-selected router connection
      description: >-
        Central nodes only. Owner access required. URL must be an HTTPS origin
        or literal loopback HTTP origin. Both keys are required initially and
        when changing origin. Blank or omitted keys preserve the current
        origin's saved values. Connection tests complete before an atomic save.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url]
              properties:
                url: { type: string, maxLength: 2000 }
                apiKey: { type: string, maxLength: 512, writeOnly: true }
                managementKey: { type: string, maxLength: 512, writeOnly: true }
      responses:
        "200": { description: "{ success: true }" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Owner access required }
        "409": { $ref: "#/components/responses/MutationConflict" }
        "500": { description: Private configuration read or write failed }
        "502": { description: Router connection test failed }
        "503": { $ref: "#/components/responses/MutationStorageUnavailable" }
  /api/cli-router/routing:
    post:
      tags: [config]
      summary: Set upstream strategy and session affinity
      description: >-
        Owner access required. The two upstream writes are not atomic. An
        error can mean that strategy changed but affinity did not. Refresh
        the snapshot before another change. No automatic replay occurs.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [strategy, sessionAffinity]
              properties:
                strategy: { type: string, enum: [round-robin, fill-first, weighted-round-robin] }
                sessionAffinity: { type: boolean }
      responses:
        "200": { description: "{ success: true }" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Owner access required }
        "409": { $ref: "#/components/responses/MutationConflict" }
        "502": { description: Upstream write failed or had a partial outcome }
  /api/cli-router/accounts/status:
    post:
      tags: [config]
      summary: Pause or enable one upstream subscription account
      description: Owner access required. Account IDs resolve through a fresh upstream account list.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, disabled]
              properties:
                id: { type: string, maxLength: 200 }
                disabled: { type: boolean }
      responses:
        "200": { description: "{ success: true }" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Owner access required }
        "404": { description: Account not found }
        "409": { $ref: "#/components/responses/MutationConflict" }
        "502": { description: Upstream account read or status write failed }
  /api/cli-router/accounts/refresh:
    post:
      tags: [status]
      summary: Refresh one account's quota and return the router snapshot
      description: >-
        Owner access required. Provider requests use fixed server-side targets
        and the router's token substitution. Failed quota observations return
        a safe per-account quotaError, not a fabricated zero balance.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id]
              properties:
                id: { type: string, maxLength: 200 }
      responses:
        "200":
          description: CliRouterSnapshot with updated account quota or quotaError
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Owner access required }
        "404": { description: Account not found }
        "409": { $ref: "#/components/responses/MutationConflict" }
        "502": { description: Cannot read upstream accounts }

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Unique key for one intended operation, scoped to the authenticated actor,
        node, and operation. Preserve it when checking a request after connection
        loss. A duplicate returns 409 without replaying a response or executing
        again. Inspect current state before deliberately starting another action.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[A-Za-z0-9_-]{16,128}$'
  securitySchemes:
    nodeAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Bearer token for all /api routes outside trusted direct-local access; remote transport also requires TLS or explicit HTTP opt-in.
    telegramWebhook:
      type: apiKey
      in: header
      name: X-Telegram-Bot-Api-Secret-Token
      description: Exact secret set when the owner registers the Telegram webhook.
  responses:
    MutationConflict:
      description: >-
        mutation_already_accepted means the key already has a durable receipt;
        no action executes again, including after restart. idempotency_conflict
        means the same key was used with different input. Refresh current state
        before another action; never automatically retry with a new key.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    MutationStorageUnavailable:
      description: >-
        mutation_storage_unavailable means no new action started because durable
        recording failed. mutation_outcome_unknown means the action may have
        completed but its outcome could not be recorded. Inspect current state;
        never automatically retry with a new key.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    GahError:
      description: The underlying gah CLI call failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    BadRequest:
      description: Invalid request, including a missing or invalid Idempotency-Key where required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
        message: { type: string }
        operationId: { type: string, description: Opaque operation receipt identifier when available }
    ProfileSummary:
      type: object
      description: Mirrors packages/contracts/src/gah.ts ProfileSummary
      properties:
        name: { type: string }
        display_name: { type: string }
        provider: { type: string }
        repo: { type: string }
        local_path: { type: string }
        web_url: { type: string, nullable: true }
        max_parallel_workers: { type: integer, nullable: true }
        max_open_managed_mrs: { type: integer }
        manager_wake_autonomy: { type: string, nullable: true }
        delivery_mode: { type: string, enum: [pr, handoff] }
    LedgerSummary:
      type: object
      description: Mirrors packages/contracts/src/gah.ts LedgerSummary
      properties:
        ledger_path: { type: string }
        entries: { type: integer }
        success: { type: integer }
        failed: { type: integer }
        by_mode: { type: object }
        by_requested_backend: { type: object }
        by_backend: { type: object }
        by_model: { type: object }
        by_failure_class: { type: object }
        fallback_count: { type: integer }
        validation_pass: { type: integer }
        push_success: { type: integer }
        mr_count: { type: integer }
        human_required_count: { type: integer }
        attempts_started: { type: integer, nullable: true }
        attempts_completed: { type: integer, nullable: true }
        average_duration_seconds: { type: number, nullable: true }
        usage_total_tokens: { type: integer }
        estimated_cost_usd: { type: number, nullable: true }
        actual_cost_usd: { type: number, nullable: true }
        last_run: { type: string, nullable: true }
    AvailabilityRecord:
      type: object
      description: >-
        Raw `gah availability --json` row. Distinct from StatusSnapshot's
        richer AvailabilityScope[] (see ProfileSummary's neighbors above) --
        mirrors packages/contracts/src/gah.ts AvailabilityRecord.
      properties:
        backend: { type: string }
        backend_instance: { type: string }
        model: { type: string }
        quota_pool: { type: string }
        eligible: { type: boolean }
        reason: { type: string }
        unavailable_until: { type: string }
        remaining_cooldown: { type: string }
        source: { type: string }
        last_error_summary: { type: string }
