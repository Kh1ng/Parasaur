[package]
name = "git-agent-harness"
version = "0.3.0"
edition = "2021"
default-run = "gah"

[[bin]]
name = "gah"
path = "src/main.rs"

[[bin]]
name = "generate-cli-capabilities"
path = "src/bin/generate_cli_capabilities.rs"

[[bin]]
name = "gah-mcp-server"
path = "src/bin/gah_mcp_server.rs"

[dependencies]
anyhow = "1"
camino = { version = "1", features = ["serde1"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
toml = "0.8"
fs2 = "0.4"
libc = "0.2"
ratatui = "0.30"
crossterm = "0.29"
tokio = { version = "1", features = ["full"] }
tungstenite = "0.20"
uuid = { version = "1", features = ["v4"] }
url = "2"
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
chrono-tz = "0.9"
rusqlite = { version = "0.31", features = ["bundled"] }
ctrlc = { version = "3", features = ["termination"] }
hostname = "0.4"
sha2 = "0.10"
tempfile = "3"
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
serde-transcode = "1.1.1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
