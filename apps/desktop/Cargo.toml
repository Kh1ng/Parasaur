[package]
name = "gah-desktop"
version = "0.3.0"
description = "GAH desktop control surface and worker controls"
authors = ["Kh1ng"]
license = "MIT"
repository = "https://github.com/Kh1ng/git-agent-harness"
edition = "2021"

[[bin]]
name = "gah-desktop"
path = "main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
