[defaults]
artifact_root = "/home/you/.local/share/gah/artifacts"
worktree_base = "/home/you/.local/share/gah/worktrees"
llm_base_url = "http://localhost:4000"
llm_model_local = "your/local-model"
llm_model_cloud = "your/cloud-model"

# Fleet mode (issue #944): point this node at a central node's control-plane
# server so it becomes claim-eligible under central claims arbitration.
# registry_central_url = "https://central.example.com"
# registry_preflight_mode = "warn"   # "warn" | "refuse"
#
# Registration transport mode + secret ref default to trusted_lan /
# env:COORDINATOR_TOKEN; override with PARASAUR_REGISTRY_TRANSPORT_MODE and
# PARASAUR_REGISTRY_SECRET_REF environment variables. On a fresh worker, set
# PARASAUR_NODE_ADVERTISED_URL once so `gah loop` can create its stable identity.

[context]
enabled = true
soft_limit_tokens = 80000
hard_limit_tokens = 150000
compact_after_tool_calls = 20
fresh_context_on_review = true
fresh_context_on_fix = true
include_full_git_history = false
include_full_worker_transcript_in_review = false
recent_history_tokens = 20000
# Optional overrides use [context.profiles.<name>] and
# [context.backends.<backend>].

[defaults.routing]
default_backend = "openhands"
review_backend = "claude"
# Issue #123: new two-tier reviewer model (preferred over the deprecated
# strong_review_*/weak_review_* single-pair fields).
routine_reviewer = { backend = "claude", model = "sonnet" }
escalatory_reviewers = [
    { backend = "codex" },
]
allow_review_fallback = true

# Optional deterministic implementation routing. The first rule whose
# mode/task_classes/difficulties/risks all match wins. A profile's non-empty
# task_routing_rules replaces the defaults list, so repositories can choose
# their own capacity policy without changing the binary. Equal priorities form
# a least-used balanced pool; lower priorities are fallback tiers.
[[defaults.routing.task_routing_rules]]
modes = ["improve", "fix"]
task_classes = ["documentation", "test", "mechanical"]
difficulties = ["easy"]
risks = ["low"]
candidates = [
  { backend = "opencode", model = "your-cheap-model", priority = 100, included_in_quota = true },
  { backend = "agy", model = "your-fallback-model", priority = 100, included_in_quota = true },
  { backend = "opencode", model = "your-paid-model", priority = 10, requires_approval = true },
]

[profiles.my-repo]
display_name = "My Repo"
repo_id = "my-repo"
provider = "github"
repo = "owner/repo"
local_path = "/path/to/local/clone"
artifact_root = "/home/you/.local/share/gah/artifacts/my-repo"
default_target_branch = "main"
# Daily gah-prune maintenance archives chats after this many idle days.
# Dirty work is patched first and the branch always survives. Default: 14.
chat_session_idle_days = 14
validation_commands = []

[profiles.my-repo.routing]
pm_backend = "claude"
improve_backend = "codex"
# Optional ordered project-guidance candidates for PM decomposition.
pm_guidance_paths = ["docs/PM_GUIDANCE.md", "PM_GUIDANCE.md"]
