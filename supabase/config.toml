# Generic local development settings for the self-hosted orchestration
# schema (issue #1601). This file is intentionally free of hosted project
# refs, URLs, and keys; remote link state stays in the ignored supabase/.temp/.
# Public sign-ups are disabled for the closed beta (#1597).
project_id = "parasaur"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://127.0.0.1:3001"
additional_redirect_urls = ["http://localhost:3001"]
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
enable_confirmations = true

[auth.sms]
enable_signup = false
