name: Android

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/android.yml'
      - 'apps/android/**'

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # The action's default list includes the legacy `tools` package,
          # which Google removed from the SDK repository; sdkmanager now
          # exits 1 on it before the build starts.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.14.3'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.1'
      - run: gradle -p apps/android testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: gah-android-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
