name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '34 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Select CodeQL languages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
      has_languages: ${{ steps.scope.outputs.has_languages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Fetch commit/tree history without the old build-artifact blobs.
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test language selection
        run: node --test scripts/codeql-scope.test.mjs
      - name: Select changed languages
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != pull_request ] \
            || [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]; then
            node scripts/codeql-scope.mjs --all </dev/null >> "$GITHUB_OUTPUT"
          else
            range="$BASE_SHA...$HEAD_SHA"
            # Include both paths of renames, plus deletions. Do not truncate large PRs.
            git diff --name-only --no-renames -z "$range" \
              | node scripts/codeql-scope.mjs >> "$GITHUB_OUTPUT"
          fi
      - name: Report migration status
        if: vars.CODEQL_ADVANCED != 'true'
        run: echo '::notice::Default CodeQL setup remains active. Follow docs/CODEQL.md to activate the replacement after merge.'

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: scope
    # Keep the rollout PR from duplicating scans or uploading against default setup.
    if: vars.CODEQL_ADVANCED == 'true' && needs.scope.outputs.has_languages == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}
          dependency-caching: true
      - name: Compile Swift application, widget, and test targets
        if: matrix.language == 'swift'
        run: |
          xcodebuild -project apps/ios/GAH.xcodeproj -scheme GAH \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/gah-codeql-swift" \
            CODE_SIGNING_ALLOWED=NO build-for-testing
      - name: Analyze language
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  result:
    name: CodeQL scans
    needs: [scope, analyze]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check selected scans
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          ANALYZE_RESULT: ${{ needs.analyze.result }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$ANALYZE_RESULT" = success || test "$ANALYZE_RESULT" = skipped
