name: Frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # The CI node job builds web assets, tests the server and uploads gah-web-dist.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:contracts && npm run build:shared

      - name: Typecheck frontend
        run: npm run typecheck --workspace=apps/web

      - name: Typecheck server application
        run: npm run typecheck --workspace=apps/server

      - name: Typecheck mock control plane
        run: npm run typecheck:mock --workspace=apps/server

  # Hermetic Playwright e2e + component tests (issue #636). The webServer in
  # playwright.config.ts starts a fixture-backed apps/server (GAH_BINARY ->
  # tests/fixtures/gah) plus the vite dev server, so this runs on a runner
  # with no gah binary and no gah config. Uses the same Node 20 toolchain as
  # the build job; Playwright downloads its own chromium.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:contracts && npm run build:shared

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Check bundled desktop Settings
        run: node scripts/test-desktop-settings.mjs

      - name: Run unit tests
        run: npm run test:unit --workspace=apps/web

      - name: Run e2e tests
        id: e2e
        run: npm run e2e --workspace=apps/web

      - name: Run component tests
        # A failing e2e assertion must not hide independent component regressions.
        if: ${{ !cancelled() && (steps.e2e.outcome == 'success' || steps.e2e.outcome == 'failure') }}
        run: npm run test:component --workspace=apps/web

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
