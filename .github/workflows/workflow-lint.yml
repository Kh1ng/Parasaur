name: Workflow lint

# Static checks for GitHub Actions workflows: actionlint for syntax and
# expression errors, zizmor for security weaknesses (dangerous triggers,
# template injection, unpinned third-party actions, excessive permissions).
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/zizmor.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/zizmor.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install linters
        run: python -m pip install --disable-pip-version-check 'zizmor==1.31.1' 'actionlint-py==1.7.12.25'
      - name: actionlint
        run: actionlint
      - name: zizmor
        # Fails on high-severity findings; cache-poisoning findings on the
        # release workflows are tracked separately and stay advisory.
        run: zizmor --offline --format github --min-severity high --min-confidence medium .github/workflows/
