name: Release — macOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (e.g. v0.2.0). Created if absent; shared with other release workflows when set.
        default: ''
        required: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: macOS DMG
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop

      - name: Install dependencies
        run: npm ci

      - name: Check release version
        env:
          GAH_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
        run: node scripts/check-release-version.mjs "$GAH_RELEASE_TAG"

      - name: Build shared packages
        run: npm run build:contracts && npm run build:shared

      - name: Build frontendDist stub
        working-directory: apps/desktop
        run: npx vite build

      - name: Test release signing gate
        run: node --test scripts/build-signed-macos.test.mjs

      - name: Build and verify signed, notarized DMG
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/build-signed-macos.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUTS_VERSION: ${{ inputs.version }}
        run: |
          dmgs=(apps/desktop/target/release/bundle/dmg/*.dmg)
          dmg=${dmgs[0]}
          [ -e "$dmg" ] || { echo "no DMG bundle matched" >&2; exit 1; }
          tag="${INPUTS_VERSION}"
          if [ -z "$tag" ] && [ "${GITHUB_REF_TYPE}" = tag ]; then
            tag="${GITHUB_REF_NAME}"
          fi
          if [ -z "$tag" ]; then
            tag="release-$(date -u +%Y%m%d-%H%M)-macos"
          fi
          gh release create "$tag" "$dmg" \
            --title "GAH Worker — $tag" \
            --notes "macOS DMG signed with Developer ID and notarized by Apple. Built from ${GITHUB_REF}." \
            --repo "${{ github.repository }}" || \
          gh release upload "$tag" "$dmg" --clobber \
            --repo "${{ github.repository }}"
