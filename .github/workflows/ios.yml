name: iOS controller

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'apps/ios/**'
      - 'scripts/test-ios-central.sh'
      - 'scripts/test-ios-central.py'
      - 'docs/IOS_TESTING.md'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check physical test helper
        run: |
          bash -n scripts/test-ios-central.sh
          python3 scripts/test-ios-central.py
      - name: Select an available iPhone simulator
        id: simulator
        run: |
          xcodebuild -version
          xcrun simctl list devices available -j > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          devices = json.loads(Path(os.environ['RUNNER_TEMP'], 'simulators.json').read_text())['devices']
          phones = [device for runtime, group in devices.items() if '.iOS-' in runtime
                    for device in group if device['name'].startswith('iPhone')]
          if not phones:
              raise SystemExit('No available iPhone simulator on this runner')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('id=' + phones[0]['udid'] + '\n')
          PY
      - name: Test native navigation and persistent web session
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          python3 apps/ios/GAHTests/test_fixture.py
          python3 apps/ios/GAHTests/fixture.py &
          FIXTURE_PID=$!
          trap 'kill "$FIXTURE_PID"' EXIT
          xcodebuild -project apps/ios/GAH.xcodeproj -scheme GAH \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/gah-ios" \
            -resultBundlePath "$RUNNER_TEMP/gah-ios-tests.xcresult" \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 240 \
            -retry-tests-on-failure -test-iterations 2 \
            -test-repetition-relaunch-enabled YES \
            CODE_SIGNING_ALLOWED=NO test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gah-ios-simulator-results
          path: ${{ runner.temp }}/gah-ios-tests.xcresult
          retention-days: 7
