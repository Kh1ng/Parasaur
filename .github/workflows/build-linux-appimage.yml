name: Build and verify Linux desktop

on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: ''
      artifact_name:
        type: string
        default: gah-desktop-linux-appimage

permissions:
  contents: read

jobs:
  build:
    name: Linux AppImage (GUI smoke)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Check release version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/check-release-version.mjs "$RELEASE_TAG"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            .
            apps/desktop

      - name: Install Tauri and smoke-test system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            xvfb xdotool imagemagick at-spi2-core python3-pyatspi

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:contracts && npm run build:shared

      - name: Build local connection screen
        working-directory: apps/desktop
        run: npx vite build

      - name: Generate icons
        working-directory: apps/desktop
        run: npx tauri icon icons/icon.png

      - name: Build the AppImage
        working-directory: apps/desktop
        run: |
          bash ../../scripts/build-linux-standalone.sh
          npx tauri build --config standalone.bundle.json --bundles appimage

      - name: Run the packaged standalone dashboard without host build tools
        run: bash scripts/smoke-standalone-runtime.sh apps/desktop/target/release/bundle/appimage/*.AppImage

      - name: Open the AppImage and install standalone from its Settings screen
        run: scripts/smoke-linux-appimage.sh apps/desktop/target/release/bundle/appimage/*.AppImage appimage-smoke/first-window.png --install

      - name: Upload AppImage and smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            apps/desktop/target/release/bundle/appimage/*.AppImage
            appimage-smoke/*
          if-no-files-found: warn
