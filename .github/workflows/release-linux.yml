name: Release — Linux

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (e.g. v0.2.0). Created if absent; shared with other release workflows when set.
        default: ''
        required: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-linux-appimage.yml
    with:
      release_tag: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version || '' }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gah-desktop-linux-appimage
          path: verified
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUTS_VERSION: ${{ inputs.version }}
        run: |
          appimages=(verified/apps/desktop/target/release/bundle/appimage/*.AppImage)
          appimage=${appimages[0]}
          [ -e "$appimage" ] || { echo "no AppImage bundle matched" >&2; exit 1; }
          tag="${INPUTS_VERSION}"
          if [ -z "$tag" ] && [ "${GITHUB_REF_TYPE}" = tag ]; then
            tag="${GITHUB_REF_NAME}"
          fi
          if [ -z "$tag" ]; then
            tag="release-$(date -u +%Y%m%d-%H%M)-linux"
          fi
          gh release create "$tag" "$appimage" --target "$GITHUB_SHA" \
            --title "GAH Worker — $tag" \
            --notes "Linux AppImage (portable, no install needed — chmod +x and run). Built from ${GITHUB_REF}." \
            --repo "${{ github.repository }}" || \
          gh release upload "$tag" "$appimage" --clobber \
            --repo "${{ github.repository }}"
