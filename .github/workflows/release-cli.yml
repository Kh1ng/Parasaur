name: Release — CLI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (e.g. v0.2.0). Created if absent; shared with other release workflows when set.
        default: ''
        required: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: CLI — macOS (universal)
            artifact_name: gah-macos-universal
            mcp_artifact_name: gah-mcp-server-macos-universal
            # Build arm64 natively and cross-compile x86_64, then lipo
            extra_targets: x86_64-apple-darwin
          - os: ubuntu-22.04
            name: CLI — Linux (x86_64)
            artifact_name: gah-linux-x86_64
            mcp_artifact_name: gah-mcp-server-linux-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Check release version
        env:
          GAH_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
        run: node scripts/check-release-version.mjs "$GAH_RELEASE_TAG"

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.extra_targets || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build CLI (macOS universal)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --bin gah --bin gah-mcp-server --target aarch64-apple-darwin
          cargo build --release --bin gah --bin gah-mcp-server --target x86_64-apple-darwin
          lipo -create \
            target/aarch64-apple-darwin/release/gah \
            target/x86_64-apple-darwin/release/gah \
            -output gah-macos-universal
          lipo -create \
            target/aarch64-apple-darwin/release/gah-mcp-server \
            target/x86_64-apple-darwin/release/gah-mcp-server \
            -output gah-mcp-server-macos-universal

      - name: Build CLI (Linux)
        if: runner.os == 'Linux'
        run: cargo build --release --bin gah --bin gah-mcp-server

      - name: Stage artifact
        run: |
          if [ "${{ runner.os }}" != "macOS" ]; then
            cp target/release/gah "${{ matrix.artifact_name }}"
            cp target/release/gah-mcp-server "${{ matrix.mcp_artifact_name }}"
          fi
          chmod +x "${{ matrix.artifact_name }}" "${{ matrix.mcp_artifact_name }}"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUTS_VERSION: ${{ inputs.version }}
        run: |
          tag="${INPUTS_VERSION}"
          if [ -z "$tag" ] && [ "${GITHUB_REF_TYPE}" = tag ]; then
            tag="${GITHUB_REF_NAME}"
          fi
          if [ -z "$tag" ]; then
            tag="release-$(date -u +%Y%m%d-%H%M)-cli"
          fi
          gh release create "$tag" "${{ matrix.artifact_name }}" "${{ matrix.mcp_artifact_name }}" \
            --title "Parasaur CLI — $tag" \
            --notes "Parasaur CLI and MCP server binaries for macOS (universal arm64+x86_64) and Linux (x86_64). The CLI installs as gah; gah update and the installers add the parasaur command next to it. Built from ${GITHUB_REF}." \
            --repo "${{ github.repository }}" || \
          gh release upload "$tag" "${{ matrix.artifact_name }}" "${{ matrix.mcp_artifact_name }}" --clobber \
            --repo "${{ github.repository }}"
