# Native desktop builds also gate pull requests that change the app or its installer.
name: Desktop

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/desktop.yml'
      - '.github/workflows/release-macos.yml'
      - 'scripts/build-signed-macos*'
      - 'scripts/smoke-linux-appimage.sh'
      - 'scripts/setup-windows.ps1'
      - 'scripts/test-windows-setup.ps1'
      - 'apps/desktop/**'
      - 'apps/server/src/nodeSetup*'
      - 'apps/server/src/authMiddleware.ts'
      - 'scripts/install-windows.ps1'
      - 'scripts/install-wsl-worker.sh'
      - 'scripts/test-windows-installer.ps1'
      - 'scripts/stage-node-test-artifacts.mjs'
      - 'scripts/test-node-test-artifacts.mjs'
      - 'scripts/install.sh'
      - 'scripts/install-linux.sh'
      - 'scripts/install-macos.sh'
      - 'scripts/install-macos-desktop.sh'
      - 'scripts/macos-launchd.sh'
      - 'scripts/configure-node-role.sh'
      - 'scripts/test-macos-install.sh'
      - 'src/installer/**'
      - 'tests/installer_scripts.rs'
      - 'src/update.rs'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
  push:
    tags:
      - 'desktop-*'

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust (stable MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop

      - name: Install dependencies
        run: npm ci

      - name: Check release version
        run: node scripts/check-release-version.mjs

      - name: Build shared packages
        run: npm run build:contracts && npm run build:shared

      - name: Check desktop types
        run: npm run --workspace=apps/desktop typecheck

      - name: Check Windows installer contracts
        run: |
          node scripts/test-node-test-artifacts.mjs
          powershell -NoProfile -File scripts/test-windows-installer.ps1

      - name: Build local connection screen
        working-directory: apps/desktop
        run: npx vite build

      - name: Generate icons
        working-directory: apps/desktop
        run: npx tauri icon icons/icon.png

      - name: Test desktop settings and URL validation
        working-directory: apps/desktop
        run: cargo test -- --test-threads=1

      - name: Build the Windows installer
        working-directory: apps/desktop
        run: npx tauri build --bundles nsis

      - name: Stage installer and source manifest
        run: node scripts/stage-node-test-artifacts.mjs desktop node-test-desktop

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: gah-worker-windows-nsis
          path: node-test-desktop/*
          if-no-files-found: error

  linux:
    name: Linux AppImage (GUI smoke)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop

      - name: Install Tauri and smoke-test system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            xvfb xdotool imagemagick

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:contracts && npm run build:shared

      - name: Build local connection screen
        working-directory: apps/desktop
        run: npx vite build

      - name: Generate icons
        working-directory: apps/desktop
        run: npx tauri icon icons/icon.png

      - name: Build the AppImage
        working-directory: apps/desktop
        run: npx tauri build --bundles appimage

      # Issue #1326: the artifact itself must show the Settings page, not a blank view.
      - name: Smoke-test the AppImage's first window
        run: scripts/smoke-linux-appimage.sh apps/desktop/target/release/bundle/appimage/*.AppImage appimage-smoke/first-window.png

      - name: Upload AppImage and smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gah-desktop-linux-appimage
          path: |
            apps/desktop/target/release/bundle/appimage/*.AppImage
            appimage-smoke/*
          if-no-files-found: warn

  macos:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/desktop

      - name: Install dependencies
        run: npm ci

      - name: Check release version
        run: node scripts/check-release-version.mjs

      - name: Build shared packages
        run: npm run build:contracts && npm run build:shared

      - name: Check desktop types
        run: npm run --workspace=apps/desktop typecheck

      # The installers run on macOS's own bash 3.2 here, against the built gah.
      - name: Check installer scripts
        run: |
          node --test scripts/build-signed-macos.test.mjs
          bash -n scripts/install-wsl-worker.sh
          cargo test --test installer_scripts

      - name: Build local connection screen
        working-directory: apps/desktop
        run: npx vite build

      - name: Test desktop settings and URL validation
        working-directory: apps/desktop
        run: cargo test -- --test-threads=1

      - name: Build the macOS app
        working-directory: apps/desktop
        run: npx tauri build --bundles app

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: gah-worker-macos-app
          path: apps/desktop/target/release/bundle/macos/*.app
          if-no-files-found: error

  linux-worker-test:
    name: Linux worker test bundle
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Linux CLI
        run: cargo build --release --bin gah
      - name: Stage CLI, tracked source, and installers
        run: node scripts/stage-node-test-artifacts.mjs worker node-test-worker
      - name: Upload worker test bundle
        uses: actions/upload-artifact@v4
        with:
          name: gah-worker-linux-test
          path: node-test-worker/*
          if-no-files-found: error

  macos-worker-install:
    name: macOS worker installation
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # A first-install test must not restore a previously installed GAH executable.
          cache-bin: false
          prefix-key: v1-rust-no-installed-binaries
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run the real macOS installer and verify installed files
        run: bash scripts/test-macos-install.sh
