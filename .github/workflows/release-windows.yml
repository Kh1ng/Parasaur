name: Release — Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (e.g. v0.2.0). Created if absent; shared with other release workflows when set.
        default: ''
        required: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Windows NSIS installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust (stable MSVC)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop

      - name: Install dependencies
        run: npm ci

      - name: Check release version
        env:
          GAH_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
        run: node scripts/check-release-version.mjs "$env:GAH_RELEASE_TAG"

      - name: Build shared packages
        run: npm run build:contracts && npm run build:shared

      - name: Check desktop types
        run: npm run --workspace=apps/desktop typecheck

      - name: Check Windows installer syntax
        if: runner.os == 'Windows'
        run: powershell -NoProfile -File scripts/test-windows-installer.ps1

      - name: Build local connection screen
        working-directory: apps/desktop
        run: npx vite build

      - name: Generate icons
        working-directory: apps/desktop
        run: npx tauri icon icons/icon.png

      - name: Build NSIS installer
        working-directory: apps/desktop
        run: npx tauri build --bundles nsis

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUTS_VERSION: ${{ inputs.version }}
        run: |
          exe=$(compgen -G 'apps/desktop/target/release/bundle/nsis/*.exe' | sort | head -n 1)
          tag="${INPUTS_VERSION}"
          if [ -z "$tag" ] && [ "${GITHUB_REF_TYPE}" = tag ]; then
            tag="${GITHUB_REF_NAME}"
          fi
          if [ -z "$tag" ]; then
            tag="release-$(date -u +%Y%m%d-%H%M)-windows"
          fi
          gh release create "$tag" "$exe" \
            --title "GAH Worker — $tag" \
            --notes "Windows NSIS silent installer. One-liner install: see scripts/install-windows.ps1. Built from ${GITHUB_REF}." \
            --repo "${{ github.repository }}" || \
          gh release upload "$tag" "$exe" --clobber \
            --repo "${{ github.repository }}"
