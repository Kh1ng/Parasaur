name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Issue: ~1.4GB of accidentally-committed target/ build artifacts sat in
  # this repo's git history for months before being discovered (.gitignore
  # already covered target/ by the time this was noticed -- the commits
  # predated that, or bypassed it via `git add -f`). Rewriting history to
  # remove it was explicitly ruled out as a fix; this is the actual fix:
  # catch the next one before it merges, not after.
  guard-no-build-artifacts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if this PR adds build-artifact-looking paths or oversized files
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          bad=0
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              target/*|*/target/*|node_modules/*|*/node_modules/*|*.rlib)
                echo "::error file=$path::looks like a build artifact -- should already be gitignored, do not force-add it"
                bad=1
                ;;
            esac
            size=$(git cat-file -s "$head:$path" 2>/dev/null || echo 0)
            if [ "$size" -gt 5242880 ]; then
              mb=$((size / 1048576))
              echo "::error file=$path::added file is ${mb}MB -- suspiciously large for a source repo, double check this is intentional"
              bad=1
            fi
          done <<< "$(git diff --name-status --diff-filter=A "$base" "$head" | cut -f2)"
          exit "$bad"

  # Issue #1318 acceptance: a standalone install must succeed on Linux with
  # no Tailscale executable, serve the dashboard, and expose nothing beyond
  # loopback. This lane runs the real scripts/install-linux.sh end to end --
  # configure-node-role, gah update (server + web build and deploy), the
  # /etc/gah/server.env bind-host policy, and gah-server.service under real
  # systemd -- then probes the live service. The failure-path diagnostics
  # (journalctl capture) are covered by source-structure tests.
  standalone-install:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run only when the install path changed
        id: scope
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$base" "$head" | grep -qE '^(scripts/(install|configure-node-role|bootstrap)|src/(setup/|installer/|update\.rs|node_role\.rs)|packaging/systemd/|apps/server/src/nodeRole\.ts|\.github/workflows/CI\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: The runner must not have a Tailscale executable (the #1318 scenario)
        if: steps.scope.outputs.run == 'true'
        run: '! command -v tailscale'

      - name: Install Node.js
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        if: steps.scope.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Stage an operator-style main checkout of this pull request
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          # `gah update` requires a clean checkout of origin's default branch
          # and a fast-forwardable pull. Serve this pull request's head from
          # a local bare "origin" whose main branch is exactly this code, so
          # the installer sees the same shape an operator's live checkout has.
          git init --bare "$HOME/origin.git"
          git -C "$HOME/origin.git" symbolic-ref HEAD refs/heads/main
          git push "$HOME/origin.git" HEAD:refs/heads/main
          git clone "$HOME/origin.git" "$HOME/gah"

      # No web-root setting is supplied (#1327): `gah update` renders the unit
      # for the installing account (#1322), and gah-server serves the
      # dashboard from the checkout's build with no web server or drop-in.
      - name: Run the real standalone installer
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          GAH_INSTALL_CONFIRMED=1 GAH_NODE_ROLE=standalone bash "$HOME/gah/scripts/install-linux.sh"

      - name: Verify service, loopback-only bind, dashboard, and role
        if: steps.scope.outputs.run == 'true'
        run: |
          set -uo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          fail() {
            echo "::error::$1"
            echo '--- systemctl status ---'
            sudo systemctl status --no-pager -l gah-server.service || true
            echo '--- journal (last 100 lines) ---'
            sudo journalctl -u gah-server.service -n 100 --no-pager || true
            echo '--- kernel log tail ---'
            sudo dmesg | tail -30 || true
            echo '--- listeners ---'
            ss -tlnp || true
            echo '--- /etc/gah/server.env ---'
            sudo cat /etc/gah/server.env || true
            exit 1
          }
          systemctl is-active --quiet gah-server.service \
            || fail "gah-server.service is not active: $(systemctl is-active gah-server.service)"
          grep -q '^HOST=127\.0\.0\.1$' /etc/gah/server.env \
            || fail "server.env HOST is not loopback: $(sudo cat /etc/gah/server.env)"
          exposed="$(ss -tln | awk '$4 ~ /:3773$/ && $4 !~ /^127\.0\.0\.1:3773$/')"
          [ -z "$exposed" ] || fail "server is listening on a non-loopback address: $exposed"
          curl -fsS http://127.0.0.1:3773/ | grep -q '<div id="root">' \
            || fail 'dashboard page did not load on loopback'
          [ ! -e /var/www/gah ] \
            || fail 'a fresh install must not create /var/www/gah'
          curl -fsS http://127.0.0.1:3773/health | grep -q '"status":"healthy"' \
            || fail '/health did not report healthy'
          role_json="$(gah status --role --json 2>&1)" \
            || fail "gah status --role --json exited non-zero: $role_json"
          printf '%s' "$role_json" | grep -Eq '"role":[[:space:]]*"standalone"' \
            || fail "gah status does not report the standalone role: $role_json"

  test:
    runs-on: ubuntu-latest
    # A normal run takes about 12 minutes; a hung test must not hold the
    # runner for GitHub's 6-hour default.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Source-size ratchets compare a PR with its base branch so a
          # baseline increase cannot disguise source growth.
          fetch-depth: 0

      - name: Compute changed files and Rust scope
        id: rust-test-scope
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          if [ -z "${base}" ] || [ "${base}" = "0000000000000000000000000000000000000000" ]; then
            base="$head~1"
          fi

          # Run each Rust suite once. Bash glob matching does not distinguish
          # src/foo.rs from src/foo/bar.rs, and --tests also reruns lib tests.
          git diff --name-only -z "$base" "$head" | bash scripts/ci-test-scope.sh >> "$GITHUB_OUTPUT"

      - name: Check CI test selection
        run: bash scripts/test-ci-test-scope.sh

      - name: Check memory hook setup
        run: |
          python3 -m venv "$RUNNER_TEMP/gah-memory-hooks-python"
          "$RUNNER_TEMP/gah-memory-hooks-python/bin/pip" install ruamel.yaml==0.18.17
          "$RUNNER_TEMP/gah-memory-hooks-python/bin/python" scripts/test-memory-hooks.py

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Check the edge release trust gate
        run: node --test scripts/release-edge-gate.test.mjs

      - name: Build frontend assets
        run: npm run build:web

      - name: Install Tauri Linux dependencies
        if: steps.rust-test-scope.outputs.has_desktop_changes == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        if: steps.rust-test-scope.outputs.has_rust_changes == 'true' || steps.rust-test-scope.outputs.has_desktop_changes == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            .
            apps/desktop

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo test
        if: steps.rust-test-scope.outputs.has_rust_changes == 'true'
        run: |
          mkdir -p "$HOME/.config/gah"
          cat > "$HOME/.config/gah/canonical.toml" <<'TOML'
          [routing]
          routine_reviewer = { backend = "codex", model = "default" }
          improve_candidates = [{ backend = "agy", model = "test-model", priority = 100, included_in_quota = true }]
          review_candidates = [{ backend = "codex", model = "default", priority = 100, included_in_quota = true }]
          TOML
          env -u GAH_CANONICAL_CONFIG cargo test

      - name: cargo clippy
        if: steps.rust-test-scope.outputs.has_rust_changes == 'true'
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Generate CLI capability artifacts
        if: steps.rust-test-scope.outputs.has_rust_changes == 'true'
        run: cargo run --bin generate-cli-capabilities

      - name: Upload CLI capability artifacts
        if: steps.rust-test-scope.outputs.has_rust_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cli-capability-artifacts
          path: |
            packages/contracts/src/cli-capabilities.ts
            packages/contracts/src/cli-capabilities.manifest.json
            packages/contracts/schemas/cli-capabilities.v1.schema.json
            packages/shared/src/cli-capabilities.ts
          if-no-files-found: error

      - name: Check desktop application
        if: steps.rust-test-scope.outputs.has_desktop_changes == 'true'
        run: |
          mkdir -p apps/desktop/dist
          cargo test --manifest-path apps/desktop/Cargo.toml
